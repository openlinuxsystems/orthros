# Host-side workspace: the `ob` build tool. The kernel is a separate
# workspace in kernel/ because it builds for a bare-metal target.
[workspace]
resolver = "3"
members = ["tools/ridlc", "tools/xtask"]
# The kernel crates that tools/xtask uses stay members of the kernel workspace.
exclude = ["kernel"]

[workspace.package]
# The OrthrOS release version. Keep kernel/Cargo.toml in step; a unit test
# in tools/xtask fails when the two differ.
version = "0.0.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/openlinuxsystems/orthros"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
