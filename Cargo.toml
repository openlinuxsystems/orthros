# Host-side workspace: the `ob` build tool. The kernel is a separate
# workspace in kernel/ because it builds for a bare-metal target.
[workspace]
resolver = "3"
members = ["tools/linux-bench", "tools/ridlc", "tools/xtask"]
# The kernel crates that tools/xtask uses stay members of the kernel
# workspace, and the ports that `ob` builds in target/ports/work are
# workspaces of their own.
exclude = ["kernel", "target"]

[workspace.package]
# The Dukovo release version. Keep kernel/Cargo.toml, userspace/Cargo.toml
# and userspace/programs/Cargo.toml in step; a unit test in tools/xtask
# fails when they differ.
version = "0.10.4"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/openlinuxsystems/orthros"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Clippy's pedantic lints that find bugs, needless copies and work, and
# unchecked pointer casts, the same set in every workspace
# (docs/coding-standard.md; xtask's tests check that the sets agree).
assigning_clones = "warn"
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_ptr_alignment = "warn"
comparison_chain = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
duration_suboptimal_units = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
format_collect = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
iter_filter_is_ok = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
manual_assert_eq = "warn"
manual_ilog2 = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
missing_fields_in_debug = "warn"
missing_panics_doc = "warn"
needless_continue = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
no_mangle_with_rust_abi = "warn"
nonminimal_bool = "warn"
ptr_as_ptr = "warn"
range_plus_one = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
same_length_and_capacity = "warn"
self_only_used_in_recursion = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
