[package]
name = "fuse-test"
description = "Tests filesystems that programs serve through /devices/fuse (ADR 0226), with a memory filesystem of its own on fuser, in the fuse boot test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The filesystem's side of Linux's FUSE protocol, which ob patches in
# from the rust-crates port (ADR 0226), at the protocol's version 7.31.
fuser = { version = "0.16.0", default-features = false, features = ["abi-7-31"] }
# The libc crate with its Radix module, which ob patches in from the
# rust-std port (ADR 0070).
libc = "0.2.191"
# The system call interface, generated from abi/*.ridl: radix-directory(2)'s
# mount_fuse and unmount, which the C library does not wrap.
radix-abi = { path = "../../../kernel/abi" }

[lints]
workspace = true
