[package]
name = "manifest"
description = "Dukovo's files that describe programs: service files (service.toml(5)), and bundle manifests from Phase 13d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The limits a service may set, generated from abi/*.ridl.
radix-abi = { path = "../../../kernel/abi" }
# Without the standard library, so that Spark reads service files with
# the same types as the service command (ADR 0216).
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
