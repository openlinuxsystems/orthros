# Programs written in bash.

# neofetch, by Dylan Araps: the system's details, without those that
# change from moment to moment.
[[source]]
name = "neofetch"
git = "https://github.com/dylanaraps/neofetch"
commit = "ccd5d9f52609bbdcd5d8fa78c4fdb0f12954125f"
license = "MIT"
kind = "scripts"
shell = "bash"

[[source.run]]
name = "version"
args = ["neofetch", "--version"]

[[source.run]]
name = "help"
args = ["neofetch", "--help"]

[[source.run]]
name = "details"
args = ["neofetch", "--stdout", "--config", "none", "--disable", "uptime", "memory", "packages", "cpu_usage", "resolution", "shell", "term", "term_font", "de", "wm", "theme", "icons", "font", "--cpu_speed", "off"]

[[source.run]]
name = "the Debian logo"
args = ["neofetch", "--config", "none", "--ascii_distro", "Debian", "-L"]

[[source.run]]
name = "the Arch logo, small"
args = ["neofetch", "--config", "none", "--ascii_distro", "arch_small", "-L"]

[[source.run]]
name = "the default config"
args = ["neofetch", "--print_config"]

