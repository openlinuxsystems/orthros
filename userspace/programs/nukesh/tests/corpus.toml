commit = "d99174e2cecfc7e5db51c05aff54c2c9dee45803"
license = "BSD-2-Clause"
kind = "scripts"
paths = ["entrypoint"]
stubs = ["nginx", "nginx-debug"]

[[source.run]]
name = "a command of its own"
args = ["entrypoint/docker-entrypoint.sh", "echo", "hello"]

[[source.run]]
name = "the server"
