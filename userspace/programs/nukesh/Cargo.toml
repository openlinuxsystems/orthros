[package]
name = "nukesh"
description = "Dukovo's shell: interactive, and /bin/sh in its POSIX mode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
indexmap = "2"
# The key events of the line editor, for Ctrl-X Ctrl-E (MIT).
crossterm = { version = "0.29.0", default-features = false }
libc = "0.2.191"
# Its styles, which reedline paints with (MIT).
nu-ansi-term = "0.50.3"
reedline = { version = "0.52.1", default-features = false }
# colors.toml(5) (Apache-2.0 OR MIT).
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
