[package]
name = "systools"
description = "Dukovo's native administration tools (ps, top, lsof, rtrace and the rest) as one program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# authd(8)'s account files and Argon2id hashes, and what it is asked
# (ADR 0218).
accounts = { path = "../accounts", features = ["hash"] }
# keymap(1)'s layouts and their setting (ADR 0149).
keymap = { path = "../keymap" }
libc = "0.2.191"
# service(8)'s check, new and edit read service files as Spark does
# (ADR 0216).
manifest = { path = "../manifest" }
# The system call interface, generated from abi/*.ridl, for what the C
# library does not wrap: affinity, I/O priority, tracing.
radix-abi = { path = "../../../kernel/abi" }
# The firmware's SMBIOS tables, as the kernel reads them, for hwinfo(8)
# (ADR 0231).
radix-smbios = { path = "../../../kernel/lib/smbios" }
radix-spd = { path = "../../../kernel/lib/spd" }
# logd(8)'s records and requests, as lines of JSON (ADR 0210).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
# The network stack's DHCP messages (0BSD), which netd(8) reads and
# writes with it (ADR 0191); the socket feature only for the crate to
# build.
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-dhcpv4",
    "socket-udp",
] }

[lints]
workspace = true
