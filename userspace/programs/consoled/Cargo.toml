[package]
name = "consoled"
description = "Dukovo's virtual consoles: terminals on the screen and keyboard, with a shell on each"
version.workspace = true
edition.workspace = true
# The code is the project's; the fonts it draws with are Spleen's
# (BSD-2-Clause), from radix-fbcon.
license = "(Apache-2.0 OR MIT) AND BSD-2-Clause"
repository.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.191"
# The system call interface, generated from abi/*.ridl: the framebuffer's
# and the keyboard's own requests.
radix-abi = { path = "../../../kernel/abi" }
# The kernel console's Spleen fonts and the choice between them, so that
# the consoles look as the kernel's log did.
radix-fbcon = { path = "../../../kernel/lib/fbcon" }
# Alacritty's parser of terminal escape sequences (Apache-2.0 OR MIT).
vte = { version = "0.14.1", default-features = false }

[lints]
workspace = true
