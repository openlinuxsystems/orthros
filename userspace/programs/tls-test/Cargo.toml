[package]
name = "tls-test"
description = "Tests TLS on Radix, rustls on ring, in the tls boot test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# ring 0.17 with its assembly, which ob patches in from the rust-crates
# port (ADR 0192).
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
