\* `ob test tla` checks the channel's wake-up protocol with one-message
\* queues, so that both kinds of waiting (for room, for a message) happen,
\* for every script in Scripts. TLC also reports any deadlock.
SPECIFICATION Spec

CONSTANTS
    Cap = 1

INVARIANTS
    TypeOK

PROPERTIES
    BothFinish
