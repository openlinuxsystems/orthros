#
# Accounts: authd(8) alone changes the account files: the names in
# /system/settings/passwd and group, and the passwords' Argon2id hashes
# in /system/state/authd, which no other program reads. user(8) and
# passwd(1) ask it (ADR 0218), login(1) signs people in through it
# (ADR 0250), and elevate(8) runs commands as an administrator through it
# (ADR 0219).
#
# service.toml(5) explains each setting. `service check authd` checks
# this file, and `service edit authd` checks it as you save.

service_version = 1
description = "Accounts"
program = "/system/commands/authd"
# Lower starts first: before the consoles, which will sign people in
# through it.
order = 8
# Started again whenever it ends: always, on-failure or never.
restart = "always"

[limits]
# The sessions it starts, and all they run, share its domain, as the
# shells shared consoled's before sign-in, so it has no memory limit and
# twice the default CPU weight. A password's hash takes 64 MiB while it
# is made, one at a time.
cpu_weight = 200
memory = "none"

# What it holds: the whole tree, as Spark does, past the owners and modes
# of files: it writes the account files, and makes each new home its
# owner's.
[permissions]
runs-with-your-access = true
# The names capability: it starts each session as the person who signs
# in (ADR 0250). No other service holds it.
names = true
# The platform capability, which it hands to an administrator's command
# inside elevate (ADR 0219), so that ectool(8) works there as at root's
# shell.
admin.hardware = true
# The network, which it hands on (ADR 0257): each session connects out
# and listens on the ports from 1024, as anyone may on Linux; root's
# session and an administrator's command inside elevate also listen
# below 1024 and set up the interfaces with ip(8).
network.outbound = true
network.listen = ["1-65535"]
admin.network = true
