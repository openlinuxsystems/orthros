#
# Volumes: volumed(8) mounts each disk or partition plugged in after boot
# at /volumes/<label>, as udisks does on Linux, and unmounts those of a
# disk pulled out; eject(1) unmounts one before it is pulled out.
#
# service.toml(5) explains each setting. `service check volumed` checks
# this file, and `service edit volumed` checks it as you save.

service_version = 1
description = "Volumes"
program = "/system/commands/volumed"
# After the disks are mounted, which it takes as done.
order = 40
# Started again whenever it ends: always, on-failure or never.
restart = "always"

# What it holds beyond what every service reads (service.toml(5)): the
# disks, /system/live/disk, where it keeps the links of /devices/disk,
# and /volumes, where it mounts them.
[permissions]
files.read-write = ["/devices", "/system/live/disk"]
files.mount = ["/volumes"]
