#
# The shell's colours, and those it gives ls, grep, diff and ip
# (colors.toml(5)).
#
# To change them for everyone, edit this file. To change them for
# yourself, copy the keys you want into ~/.config/nukesh/colors.toml:
# yours win, key by key. `nukesh --colors` shows every key in its colour;
# `nukesh --colors --check` checks the files. Changes show in the next
# shell you start.
#
# A style is a few words: one of the 16 colours, then `on` and another
# for the background, and any of bold, dim, italic, underline and
# reverse. The colours are black, red, green, yellow, blue, magenta,
# cyan, white, and the same with `bright-` before them. "none" is the
# terminal's own text. Only these 16 are offered, so the colours follow
# your terminal's theme.
#
# Colours are off when NO_COLOR is set, when the output is not a
# terminal, and everywhere with:
enabled = true

# Where the keys below start from: "default", "high-contrast" (bright
# and bold, nothing faded), "light" (for a light background) or
# "colorblind" (blue and yellow in place of green and red). The keys you
# set change the theme's, one by one.
theme = "default"

# The prompt: name@host folder $, with a ✗ badge and the code after a
# failed command, and an admin badge while you are root. On the right:
# how long the last command took, once it took took-after seconds or
# more, how many jobs you have, and in a git repository its branch and
# state: an operation under way, how far ahead and behind, and the files
# staged, changed, untracked and in conflict. The prompt
# is drawn this way while PS1 is left at its default.
[prompt]
enabled = true
user = "green"
at = "bright-black"
host = "green"
path = "bold blue"
symbol = "magenta"
error = "bold bright-white on red"
admin = "bold bright-white on yellow"
private = "bold bright-white on blue"
took = "yellow"
jobs = "cyan"
branch = "magenta"
git-state = "bold yellow"
git-sync = "cyan"
git-conflict = "bold red"
git-staged = "green"
git-changed = "yellow"
git-untracked = "red"
git-stash = "bright-black"
git-clean = "green"
took-after = 3

# The command line as you type it. An unknown command is underlined as
# well as red, so that it shows without colour too.
[line]
enabled = true
command = "green"
unknown = "red underline"
keyword = "bold blue"
option = "cyan"
string = "yellow"
variable = "magenta"
operator = "bold yellow"
comment = "bright-black"
hint = "bright-black"

# Suggestions: faded text from your history after the cursor (→ or End
# takes it), "Did you mean ...?" after "command not found", and what an
# option does, faded after it as you type it.
[suggest]
history = true
did-you-mean = true
options = true

# ls (LS_COLORS). `enabled = false` leaves ls without colour.
[ls]
enabled = true
directory = "bold blue"
program = "bold green"
link = "cyan"
broken-link = "red reverse"
archive = "red"
pipe = "yellow"
socket = "magenta"
device = "bold yellow"

# grep (GREP_COLORS).
[grep]
enabled = true
match = "bold red"
file = "magenta"
line = "green"
separator = "bright-black"

# diff (its --palette), and git's diffs: git takes these, and the
# prompt's git colours for git status and git branch, from a file each
# shell writes (~/.local/state/nukesh/gitconfig). In git's diffs, a
# changed line's words that changed are marked (added-word and
# removed-word), and lines git saw moved get colours of their own.
[diff]
enabled = true
added = "green"
removed = "red"
header = "bold"
hunk = "cyan"
added-word = "green reverse"
removed-word = "red reverse"
moved-added = "bold cyan"
moved-removed = "bold magenta"

# ip (IP_COLORS).
[ip]
enabled = true
name = "cyan"
up = "green"
down = "red"
address = "magenta"
address6 = "blue"
mac = "yellow"
