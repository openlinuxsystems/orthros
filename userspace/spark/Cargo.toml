[package]
name = "spark"
description = "Spark, the first program: it starts the programs of the boot archive and reaps them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "spark"
test = false
bench = false

[dependencies]
libradix = { path = "../libradix" }
# Service files, read as the service command reads them (ADR 0216).
manifest = { path = "../programs/manifest" }
# To name a locked BitLocker volume (ADR 0240): its format only.
radix-bitlocker = { path = "../../kernel/fs/bitlocker" }
radix-rt = { path = "../radix-rt" }

[lints]
workspace = true
