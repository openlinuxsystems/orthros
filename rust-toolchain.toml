# The single pinned toolchain for the whole tree. `ob setup` installs it, and
# rustup picks it up automatically in every directory below this one.
# Bumping it is a reviewed change of its own (see docs/coding-standard.md).
[toolchain]
channel = "nightly-2026-10-15"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
# The x86-64 kernel builds `core` from rust-src for its own target
# (kernel/targets/); aarch64-unknown-none is for CI's check of the AArch64
# HAL stubs.
targets = ["aarch64-unknown-none"]
profile = "minimal"
