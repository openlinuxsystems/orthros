[package]
name = "radix-ide"
description = "PCI IDE for the Radix kernel: ATA disks on IDE channels, and SATA controllers set to IDE mode, with bus-master DMA"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-ahci = { path = "../ahci" }
radix-hw = { path = "../../lib/hw" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
