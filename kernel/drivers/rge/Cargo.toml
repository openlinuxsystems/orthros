[package]
name = "radix-rge-net"
description = "Realtek's 2.5 and 5 gigabit Ethernet controllers for the Radix kernel: the RTL8125 and RTL8126 families"
version.workspace = true
edition.workspace = true
license = "(Apache-2.0 OR MIT) AND ISC"
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }
radix-nic = { path = "../nic" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
