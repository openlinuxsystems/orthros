[package]
name = "radix-watchdog"
description = "Chipset watchdogs for the Radix kernel: QEMU's i6300esb, Intel's TCO timer and AMD's FCH watchdog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
