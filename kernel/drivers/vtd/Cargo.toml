[package]
name = "radix-vtd"
description = "Intel VT-d for the Radix kernel: DMA remapping units, each device's own domain of pages, and their faults"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }

[dev-dependencies]
proptest = { version = "1.7", default-features = false, features = ["std"] }
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
