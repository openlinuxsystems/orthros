[package]
name = "radix-intel-net"
description = "Intel's Ethernet controllers for the Radix kernel: the e1000 and e1000e family, igb, igc and ixgbe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }
radix-nic = { path = "../nic" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
