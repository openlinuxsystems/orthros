[package]
name = "radix-realtek-net"
description = "Realtek's gigabit and fast Ethernet controllers for the Radix kernel: the RTL8169, RTL8168 and RTL810x family"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }
radix-nic = { path = "../nic" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
