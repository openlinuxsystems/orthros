[package]
name = "radix-sdhci"
description = "SD host controllers for the Radix kernel: SD and SDHC/SDXC memory cards in a card reader that follows the SD Host Controller specification, with ADMA2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
