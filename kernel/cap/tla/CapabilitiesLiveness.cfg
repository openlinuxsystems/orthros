\* `ob test tla` checks every property, liveness included, with this
\* configuration: three slots and derivations two deep, without symmetry
\* (which TLC cannot use for liveness). About 220,000 distinct states.
SPECIFICATION Spec

CONSTANTS
    Slots = {s1, s2, s3}
    Objects = {o1, o2}
    Rights = {"copy", "use"}
    MaxDepth = 2
    None = None
    NoCap = NoCap

INVARIANTS
    TypeOK
    EmptySlotsAreBlank
    TreeWellFormed
    TreeIsDerivation
    RightsNeverWiden
    SameOrInnerObject
    ParentCovers
    OriginsAcyclic
    BadgesFixed
    CopiedOnlyWithCopy

PROPERTIES
    CapsImmutable
    NoDerivationUnderRevoke
    RevokeIsComplete
    RevokeTerminates
