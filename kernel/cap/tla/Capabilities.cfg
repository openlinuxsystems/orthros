\* `ob test tla` checks the safety properties with this configuration. Four
\* slots, two objects and two rights reach every shape of tree that four
\* capabilities can make, derivations three deep, and revokes nested in
\* revokes: about 1.3 million distinct states, a minute or two on 4 CPUs.
\* CapabilitiesLiveness.cfg checks that revokes end.
SPECIFICATION Spec
SYMMETRY Symmetry

CONSTANTS
    Slots = {s1, s2, s3, s4}
    Objects = {o1, o2}
    Rights = {"copy", "use"}
    MaxDepth = 3
    None = None
    NoCap = NoCap

INVARIANTS
    TypeOK
    EmptySlotsAreBlank
    TreeWellFormed
    TreeIsDerivation
    RightsNeverWiden
    SameObject
    BadgesFixed
    CopiedOnlyWithCopy

PROPERTIES
    CapsImmutable
    NoDerivationUnderRevoke
    RevokeIsComplete
