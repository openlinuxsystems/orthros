\* `ob test tla` checks the safety properties with this configuration. Four
\* slots, two objects and two rights reach every shape of tree that four
\* capabilities can make, derivations three deep, and revokes nested in
\* revokes: about 2.8 million distinct states, four minutes on 4 CPUs.
\* CapabilitiesRetype.cfg nests memory deeper, and CapabilitiesLiveness.cfg
\* checks that revokes end.
SPECIFICATION Spec
SYMMETRY Symmetry

CONSTANTS
    Slots = {s1, s2, s3, s4}
    Objects = {o1, o2}
    Rights = {"copy", "use"}
    MaxDepth = 3
    None = None
    NoCap = NoCap

INVARIANTS
    TypeOK
    EmptySlotsAreBlank
    TreeWellFormed
    TreeIsDerivation
    RightsNeverWiden
    SameOrInnerObject
    ParentCovers
    OriginsAcyclic
    BadgesFixed
    CopiedOnlyWithCopy

PROPERTIES
    CapsImmutable
    NoDerivationUnderRevoke
    RevokeIsComplete
