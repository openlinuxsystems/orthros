\* `ob test tla` also checks the safety properties with this configuration.
\* Three objects let memory be retyped from memory that was itself retyped,
\* so deleting the capability in the middle moves the innermost one up past
\* the memory it was retyped from (ParentCovers). Three slots and
\* derivations three deep: about 190,000 distinct states, ten seconds on
\* 4 CPUs.
SPECIFICATION Spec
SYMMETRY Symmetry

CONSTANTS
    Slots = {s1, s2, s3}
    Objects = {o1, o2, o3}
    Rights = {"copy", "use"}
    MaxDepth = 3
    None = None
    NoCap = NoCap

INVARIANTS
    TypeOK
    EmptySlotsAreBlank
    TreeWellFormed
    TreeIsDerivation
    RightsNeverWiden
    SameOrInnerObject
    ParentCovers
    OriginsAcyclic
    BadgesFixed
    CopiedOnlyWithCopy

PROPERTIES
    CapsImmutable
    NoDerivationUnderRevoke
    RevokeIsComplete
