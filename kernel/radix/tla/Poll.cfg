\* `ob test tla` checks every property of poll's waits with three pollers
\* and two objects, each poller looking at one or both, so a change wakes
\* pollers that do not look at it as well as those that do.
SPECIFICATION Spec

CONSTANTS
    Pollers = {p1, p2, p3}
    Objects = {o1, o2}

INVARIANTS
    TypeOK
    NoLostWakeup
    Counted

PROPERTIES
    EveryPollEnds
