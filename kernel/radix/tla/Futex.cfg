\* `ob test tla` checks every property of futex waits and wakes with two
\* waiters, one of which may be interrupted at any moment, and two wakers
\* that wake one each. FutexBatch.cfg has one waker wake both, a batch of
\* one at a time.
SPECIFICATION Spec

CONSTANTS
    Waiters = {a, b}
    Wakers = {k1, k2}
    Count = 1
    Batch = 1
    Signalled = {a}

INVARIANTS
    TypeOK
    NoLostWakeup
    WakesCount
    ListIsCurrent

PROPERTIES
    EveryWaitEnds
