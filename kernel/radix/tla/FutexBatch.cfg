\* `ob test tla` checks futex waits and wakes with two waiters that may
\* both be interrupted and one waker that wakes them both, taking one off
\* the list at a time and going back for the next.
SPECIFICATION Spec

CONSTANTS
    Waiters = {a, b}
    Wakers = {k1}
    Count = 2
    Batch = 1
    Signalled = {a, b}

INVARIANTS
    TypeOK
    NoLostWakeup
    WakesCount
    ListIsCurrent

PROPERTIES
    EveryWaitEnds
