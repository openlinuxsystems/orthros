\* `ob test tla` checks every property of `join` with three callers that
\* join twice each and two helpers, so callers find every helper busy,
\* take halves back, and wait.
SPECIFICATION Spec

CONSTANTS
    Callers = {c1, c2, c3}
    Helpers = {h1, h2}
    Rounds = 2
    None = None

INVARIANTS
    TypeOK
    RunsOnce
    NoUseAfterReturn
    OneCaller

PROPERTIES
    EveryJoinEnds
