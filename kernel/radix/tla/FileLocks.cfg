\* `ob test tla` checks every property of file-lock waits with three
\* processes that each take a lock on one of two files twice, so a file
\* may have two waiters and a release of the other file's lock moves
\* `CHANGES` under them.
SPECIFICATION Spec

CONSTANTS
    Procs = {a, b, c}
    Files = {f, g}
    Rounds = 2

INVARIANTS
    TypeOK
    NoLostWakeup
    HolderHolds

PROPERTIES
    EveryLockIsTaken
