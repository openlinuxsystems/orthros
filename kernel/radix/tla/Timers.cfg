\* `ob test tla` checks every property of the timer thread with two
\* processes whose threads each set or turn off their timer twice, at any
\* moment of the timer thread's look.
SPECIFICATION Spec

CONSTANTS
    Procs = {p, q}
    Rounds = 2

INVARIANTS
    TypeOK
    Listed
    Queued

PROPERTIES
    EveryTimerFires
