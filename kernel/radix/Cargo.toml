[package]
name = "radix"
description = "The Radix kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "radix"
test = false
bench = false

[dependencies]
radix-abi = { path = "../abi" }
radix-acpi = { path = "../lib/acpi" }
radix-ahci = { path = "../drivers/ahci" }
radix-ide = { path = "../drivers/ide" }
radix-nvme = { path = "../drivers/nvme" }
radix-sdhci = { path = "../drivers/sdhci" }
radix-ucsi = { path = "../drivers/ucsi" }
radix-vmd = { path = "../drivers/vmd" }
radix-block = { path = "../fs/block" }
# BitLocker volumes unlocked as block devices of their own (ADR 0240).
radix-bitlocker = { path = "../fs/bitlocker", features = ["device"] }
radix-bootfs = { path = "../lib/bootfs" }
radix-cap = { path = "../cap" }
radix-crosec = { path = "../drivers/crosec" }
radix-elf = { path = "../lib/elf" }
radix-ena = { path = "../drivers/ena" }
radix-btrfs = { path = "../fs/btrfs" }
radix-exfat = { path = "../fs/exfat" }
radix-ext4 = { path = "../fs/ext4" }
radix-iso9660 = { path = "../fs/iso9660" }
radix-ntfs = { path = "../fs/ntfs" }
radix-udf = { path = "../fs/udf" }
radix-fat = { path = "../fs/fat" }
radix-fbcon = { path = "../lib/fbcon" }
radix-gpio = { path = "../drivers/gpio" }
radix-gve = { path = "../drivers/gve" }
radix-i2c = { path = "../drivers/i2c" }
radix-hal = { path = "../hal" }
radix-hw = { path = "../lib/hw" }
radix-hid = { path = "../lib/hid" }
radix-input = { path = "../lib/input" }
radix-intel-net = { path = "../drivers/intel" }
radix-ipc = { path = "../ipc" }
radix-kdb = { path = "../lib/kdb" }
radix-klog = { path = "../lib/klog" }
radix-lockdep = { path = "../lib/lockdep" }
radix-ksyms = { path = "../lib/ksyms" }
radix-mca = { path = "../lib/mca" }
radix-mm = { path = "../mm" }
radix-net = { path = "../net" }
radix-nic = { path = "../drivers/nic" }
radix-posix = { path = "../lib/posix" }
radix-pstate = { path = "../lib/pstate" }
radix-realtek-net = { path = "../drivers/realtek" }
radix-random = { path = "../lib/random" }
radix-sched = { path = "../sched" }
radix-scsi = { path = "../drivers/scsi" }
radix-sensors = { path = "../lib/sensors" }
radix-smbios = { path = "../lib/smbios" }
radix-spd = { path = "../lib/spd" }
radix-sync = { path = "../lib/sync" }
radix-tty = { path = "../lib/tty" }
radix-uacpi = { path = "../lib/uacpi" }
radix-usb = { path = "../drivers/usb" }
radix-vfs = { path = "../fs/vfs" }
radix-virtio = { path = "../drivers/virtio" }
radix-vmxnet3 = { path = "../drivers/vmxnet3" }
radix-usbhc = { path = "../drivers/usbhc" }
radix-xhci = { path = "../drivers/xhci" }
# The BitLocker keys unlock(8) hands the kernel, wiped once used
# (MIT OR Apache-2.0).
zeroize = { version = "1.8.1", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
radix-arch-x86_64 = { path = "../arch/x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
radix-arch-aarch64 = { path = "../arch/aarch64" }

[target.'cfg(target_arch = "riscv64")'.dependencies]
radix-arch-riscv64 = { path = "../arch/riscv64" }

[lints]
workspace = true
