[package]
name = "radix"
description = "The Radix kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "radix"
test = false
bench = false

[dependencies]
radix-cap = { path = "../cap" }
radix-fbcon = { path = "../lib/fbcon" }
radix-hal = { path = "../hal" }
radix-kdb = { path = "../lib/kdb" }
radix-klog = { path = "../lib/klog" }
radix-ksyms = { path = "../lib/ksyms" }
radix-mm = { path = "../mm" }
radix-sync = { path = "../lib/sync" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
radix-arch-x86_64 = { path = "../arch/x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
radix-arch-aarch64 = { path = "../arch/aarch64" }

[lints]
workspace = true
