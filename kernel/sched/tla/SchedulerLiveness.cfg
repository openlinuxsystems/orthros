\* `ob test tla` checks every property, liveness included, with this
\* configuration: two threads that each wait twice, on two CPUs, without
\* symmetry (which TLC cannot use for liveness).
SPECIFICATION Spec

CONSTANTS
    Threads = {t1, t2}
    Cpus = {c1, c2}
    Rounds = 2
    None = None

INVARIANTS
    TypeOK
    OneStackUser
    StackUserHoldsContext
    QueuesConsistent
    WakeOnTheWay

PROPERTIES
    AllFinish
