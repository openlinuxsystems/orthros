\* `ob test tla` checks the safety properties with this configuration: three
\* threads that each wait twice, on two CPUs. SchedulerLiveness.cfg checks
\* that every wait ends.
SPECIFICATION Spec
SYMMETRY Symmetry

CONSTANTS
    Threads = {t1, t2, t3}
    Cpus = {c1, c2}
    Rounds = 2
    None = None

INVARIANTS
    TypeOK
    OneStackUser
    StackUserHoldsContext
    QueuesConsistent
    WakeOnTheWay
