\* `ob test tla` checks every property, liveness included, with this
\* configuration: two callers that each send twice, two servers, a caller
\* that may be stopped, and an endpoint that closes once the callers are
\* done. Servers that all stop while callers still wait would leave them
\* waiting, as they should, so no server is stopped here.
SPECIFICATION Spec

CONSTANTS
    Callers = {c1, c2}
    Servers = {s1, s2}
    Rounds = 2
    Stoppable = {c1}
    EarlyClose = FALSE
    None = None

INVARIANTS
    TypeOK
    QueuesMatchStates
    AtMostOnce
    Delivered
    HeldCallsWait
    StateIsCurrent
    OneHolder

PROPERTIES
    AllFinish
