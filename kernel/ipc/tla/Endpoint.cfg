\* `ob test tla` checks the safety properties with this configuration: two
\* callers that each send twice (a send or a call, each time), two servers,
\* one caller and one server that may be stopped, and an endpoint that may
\* close at any moment. EndpointLiveness.cfg checks that everything ends.
SPECIFICATION Spec

CONSTANTS
    Callers = {c1, c2}
    Servers = {s1, s2}
    Rounds = 2
    Stoppable = {c1, s1}
    EarlyClose = TRUE
    None = None

INVARIANTS
    TypeOK
    QueuesMatchStates
    AtMostOnce
    Delivered
    HeldCallsWait
    StateIsCurrent
    OneHolder
