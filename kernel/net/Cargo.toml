[package]
name = "radix-net"
description = "The Radix kernel's TCP/IP stack, on smoltcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
# Without `alloc`: every buffer is lent to it (ADR 0180). A neighbour
# cache of 64 entries, as each one is looked for in turn.
smoltcp = { version = "0.14.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "auto-icmp-echo-reply",
    "iface-neighbor-cache-count-64",
] }
# smoltcp's buffers' storage, which a socket's buffers come back as (ADR
# 0182); the version and features smoltcp has, without `alloc` or `std`.
managed = { version = "0.8.0", default-features = false, features = ["map"] }

[lints]
workspace = true
