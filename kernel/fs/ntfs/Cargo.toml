[package]
name = "radix-ntfs"
description = "NTFS for Radix, read-only for now, from the public descriptions of its format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Host memory instead of the kernel's, for tests on the host.
host = ["radix-vfs/host", "radix-block/host"]

[dependencies]
radix-block = { path = "../block" }
radix-hw = { path = "../../lib/hw" }
radix-sync = { path = "../../lib/sync" }
radix-vfs = { path = "../vfs" }

[dev-dependencies]
radix-block = { path = "../block", features = ["host"] }
radix-vfs = { path = "../vfs", features = ["host"] }
# That FAT and exFAT take NTFS for none of theirs, and NTFS them.
radix-exfat = { path = "../exfat", features = ["host"] }
radix-fat = { path = "../fat", features = ["host"] }
# Host-side property tests (ADR 0019). Without default features it needs
# neither forking nor timeouts.
proptest = { version = "1.7", default-features = false, features = ["std"] }

[lints]
workspace = true
