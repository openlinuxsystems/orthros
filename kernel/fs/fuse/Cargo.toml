[package]
name = "radix-fuse"
description = "Filesystems served by programs through /devices/fuse, in Linux's FUSE protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Host memory instead of the kernel's, for tests on the host.
host = ["radix-vfs/host"]

[dependencies]
radix-sync = { path = "../../lib/sync" }
radix-vfs = { path = "../vfs" }

[dev-dependencies]
radix-vfs = { path = "../vfs", features = ["host"] }

[lints]
workspace = true
