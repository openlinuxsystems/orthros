\* `ob test tla` checks how clusters change hands with two files and two
\* clusters, each owner writing twice, with directories' clusters discarded
\* from the block cache when they are freed, as the code does.
SPECIFICATION Spec

CONSTANTS
    Files = {f1, f2}
    Clusters = {c1, c2}
    MaxVersion = 2
    Discard = TRUE

INVARIANTS
    TypeOK
    NoForeignWrites
    FilesReadBack
    DirsReadBack
