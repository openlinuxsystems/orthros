\* `ob test tla` checks commits with six places on the disk, enough for a
\* transaction to copy blocks while the commit before it is under way,
\* three generations and power cuts anywhere, with the blocks flushed
\* before the superblock and freed places pinned until it is durable, as
\* the code does. Leaves hold one value; CommitValues.cfg changes them.
SPECIFICATION Spec

CONSTANTS
    Locs = {l1, l2, l3, l4, l5, l6}
    Values = {v1}
    MaxGen = 3
    FlushFirst = TRUE
    UnpinLate = TRUE
    CopyWritten = TRUE
    None = None

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Whole
    ReadsBack
    Durable
    FreeIsFree
