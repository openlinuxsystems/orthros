\* `ob test tla` also checks commits with five places on the disk, so one
\* commit at a time, and leaves of two values: a block changed in memory
\* after it was written early must be copied, or the disk holds a value
\* its commit did not have.
SPECIFICATION Spec

CONSTANTS
    Locs = {l1, l2, l3, l4, l5}
    Values = {v1, v2}
    MaxGen = 3
    FlushFirst = TRUE
    UnpinLate = TRUE
    CopyWritten = TRUE
    None = None

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Whole
    ReadsBack
    Durable
    FreeIsFree
