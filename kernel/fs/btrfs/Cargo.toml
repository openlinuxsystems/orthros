[package]
name = "radix-btrfs"
description = "Btrfs for Radix: its trees, checksums, files and subvolumes, read-only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Host memory instead of the kernel's, for tests on the host.
host = ["radix-vfs/host", "radix-block/host"]

[dependencies]
radix-block = { path = "../block" }
radix-hw = { path = "../../lib/hw" }
radix-sync = { path = "../../lib/sync" }
radix-vfs = { path = "../vfs" }

[dev-dependencies]
radix-block = { path = "../block", features = ["host"] }
radix-vfs = { path = "../vfs", features = ["host"] }

[lints]
workspace = true
