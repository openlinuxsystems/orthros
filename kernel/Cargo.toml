# The Radix kernel workspace.
#
# The kernel builds for a bare-metal target, so it lives in its own workspace,
# separate from the host tools in the repository root. Build it with `./ob build`.

[workspace]
resolver = "3"
members = [
    "radix",
    "abi",
    "hal",
    "arch/x86_64",
    "arch/aarch64",
    "cap",
    "drivers/ahci",
    "drivers/nvme",
    "drivers/virtio",
    "fs/block",
    "fs/btrfs",
    "fs/exfat",
    "fs/ext4",
    "fs/fat",
    "fs/vfs",
    "ipc",
    "lib/acpi",
    "lib/bootinfo",
    "lib/bootfs",
    "lib/elf",
    "lib/fbcon",
    "lib/hw",
    "lib/input",
    "lib/kdb",
    "lib/klog",
    "lib/lockdep",
    "lib/ksyms",
    "lib/microcode",
    "lib/posix",
    "lib/random",
    "lib/relocs",
    "lib/sync",
    "lib/tty",
    "mm",
    "sched",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/openlinuxsystems/orthros"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# radix-mm's and radix-cap's proofs build with `--cfg kani` (`ob test kani`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
# Every `unsafe` block needs a `// SAFETY:` comment (docs/coding-standard.md).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# Clippy's pedantic lints that find bugs, needless copies and work, and
# unchecked pointer casts, the same set in every workspace
# (docs/coding-standard.md; xtask's tests check that the sets agree).
assigning_clones = "warn"
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_ptr_alignment = "warn"
comparison_chain = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
duration_suboptimal_units = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
format_collect = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
iter_filter_is_ok = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
manual_assert_eq = "warn"
manual_ilog2 = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
missing_fields_in_debug = "warn"
missing_panics_doc = "warn"
needless_continue = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
no_mangle_with_rust_abi = "warn"
nonminimal_bool = "warn"
ptr_as_ptr = "warn"
range_plus_one = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
same_length_and_capacity = "warn"
self_only_used_in_recursion = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
used_underscore_binding = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
# Keep symbols so later phases can print symbolized backtraces.
debug = true
