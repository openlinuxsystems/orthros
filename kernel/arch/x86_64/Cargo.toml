[package]
name = "radix-arch-x86_64"
description = "x86-64 support for the Radix kernel: boot, memory, interrupts, timers, SMP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = false
bench = false

[dependencies]
radix-acpi = { path = "../../lib/acpi" }
radix-bootinfo = { path = "../../lib/bootinfo" }
radix-hal = { path = "../../hal" }
radix-hw = { path = "../../lib/hw" }
radix-klog = { path = "../../lib/klog" }
radix-mca = { path = "../../lib/mca" }
radix-microcode = { path = "../../lib/microcode" }
radix-mm = { path = "../../mm" }
radix-random = { path = "../../lib/random" }
radix-relocs = { path = "../../lib/relocs" }
radix-sync = { path = "../../lib/sync" }
radix-vtd = { path = "../../drivers/vtd" }

[lints]
workspace = true
