[package]
name = "radix-posix"
description = "The rules of POSIX processes that the Radix kernel keeps: signals and their actions, wait statuses, the process tree with its groups and sessions, and the exec block and initial stack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-abi = { path = "../../abi" }

[dev-dependencies]
# Host-side property tests: random operations keep the tree's invariants.
proptest = { version = "1.7", default-features = false, features = ["std"] }

[lints]
workspace = true
