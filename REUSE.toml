# SPDX-FileCopyrightText: 2026 The Dukovo contributors
# SPDX-License-Identifier: Apache-2.0 OR MIT

# Copyright and license information for files that cannot carry an SPDX
# header of their own (https://reuse.software/spec-3.3/). Every other file
# starts with SPDX-FileCopyrightText and SPDX-License-Identifier lines, and
# CI runs `reuse lint`. See CONTRIBUTING.md and ADR 0026.

version = 1

# Generated by Cargo, which would drop a header.
[[annotations]]
path = [
    "Cargo.lock",
    "kernel/Cargo.lock",
    "userspace/Cargo.lock",
    "userspace/programs/Cargo.lock",
    "userspace/programs/host/Cargo.lock",
]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# JSON has no comments.
[[annotations]]
path = ["kernel/targets/*.json", "userspace/targets/*.json"]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# Spleen 2.1.0 by Frederic Cambus, https://github.com/fcambus/spleen, unmodified
# (ADR 0015). Its license file is fonts/LICENSE-spleen.
[[annotations]]
path = "kernel/lib/fbcon/fonts/*.psfu"
SPDX-FileCopyrightText = "2018-2024 Frederic Cambus"
SPDX-License-Identifier = "BSD-2-Clause"

# The Developer Certificate of Origin 1.1, https://developercertificate.org/,
# verbatim. Its own notice allows verbatim copies only.
[[annotations]]
path = "DCO"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO"

# musl 1.2.5's COPYRIGHT file, https://musl.libc.org, verbatim: the notice
# of the musl code ports/mlibc/musl keeps (ADR 0072).
[[annotations]]
path = "ports/mlibc/musl/COPYRIGHT"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

# What the shell's test scripts must write: bash's and dash's output,
# compared byte for byte, which a header would change.
[[annotations]]
path = "userspace/programs/nukesh/tests/cases/*.out"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The system's default user and group lists (ADR 0090) and the console
# greeting (consoled(8)), whose formats have no comments.
[[annotations]]
path = ["userspace/defaults/group", "userspace/defaults/issue", "userspace/defaults/passwd"]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# Zstandard frames of generated data, made by the zstd program, which the
# Btrfs decoder's tests read (kernel/fs/btrfs/src/tests/compressed.rs).
[[annotations]]
path = "kernel/fs/btrfs/src/tests/zstd/*.zst"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"
