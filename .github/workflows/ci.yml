# SPDX-License-Identifier: Apache-2.0 OR MIT

# Every step is an ./ob command, so anything CI does can be run locally the
# same way. See CONTRIBUTING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with tools/container/Containerfile and tools/xtask/src/doctor.rs,
  # as the host packages below are (Clang 20 is ports::CLANG_MIN).
  MDBOOK_VERSION: 0.4.52
  # Keep in step with tools/xtask/src/doctor.rs (ADR 0019).
  KANI_VERSION: 0.68.0
  # Keep in step with tools/xtask/src/tla.rs (ADR 0024).
  TLA_VERSION: 1.7.4

jobs:
  build:
    name: Lint, build, test, docs and image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf grub-common grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools dosfstools scdoc mandoc \
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison

      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob setup
        run: ./ob setup

      - name: ./ob lint
        run: ./ob lint

      - name: ./ob test
        run: ./ob test

      - name: ./ob docs --check
        run: ./ob docs --check

      - name: ./ob image
        run: ./ob image

      # `ob image` already refuses components outside their area's
      # allow-list; this checks the SPDX document itself (ADR 0021).
      - name: Validate the license manifest
        run: |
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --quiet spdx-tools==0.8.3
          "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i out/dukovo-*-x86_64.spdx

      - name: Upload the boot image
        uses: actions/upload-artifact@v4
        with:
          name: dukovo-image
          path: |
            out/dukovo-*-x86_64.img
            out/dukovo-*-x86_64.spdx
          retention-days: 14

      - name: Upload boot test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs
          path: |
            out/test/*.log
            out/test/*.ppm
          if-no-files-found: ignore

  # The cost of system calls and IPC round trips on Radix, held to Linux
  # in the same kind of virtual machine (ADR 0039), each operation's
  # fastest of three runs on each side (ADR 0046). The report goes into
  # the job's summary on every pull request and every merge to main, and
  # the numbers into an artifact.
  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf grub-common grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools dosfstools scdoc mandoc \
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The baseline Radix is held to is Linux in the same kind of virtual
      # machine (ADR 0039): the runner's own kernel, which only root may
      # read where Ubuntu installs it.
      - name: Copy the runner's Linux kernel
        run: sudo install -m 644 "/boot/vmlinuz-$(uname -r)" "$RUNNER_TEMP/vmlinuz"

      # TEMPORARY (PR #49): QEMU's timestamped trace of the disk
      # benchmarks under KVM, on both systems, before the gate's own runs.
      - name: Trace the disk benchmarks
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo; free -m
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/module/kvm/parameters/halt_poll_ns
          findmnt -T . -o TARGET,SOURCE,FSTYPE,OPTIONS
          t="$RUNNER_TEMP/qtrace"
          mkdir -p "$t/bin"
          printf '%s\n' pci_nvme_mmio_doorbell_sq pci_nvme_mmio_doorbell_cq pci_nvme_read \
            pci_nvme_write pci_nvme_map_prp pci_nvme_map_sgl pci_nvme_rw_cb pci_nvme_enqueue_req_completion pci_nvme_irq_msix \
            virtio_blk_handle_read virtio_blk_handle_write virtio_blk_submit_multireq \
            virtio_blk_rw_complete virtio_notify_irqfd virtio_notify \
            thread_pool_submit thread_pool_complete > "$t/events"
          printf '#!/bin/sh\nexec /usr/bin/qemu-system-x86_64 -msg timestamp=on -trace events=%s -D %s/trace-$$.log "$@"\n' \
            "$t/events" "$t" > "$t/bin/qemu-system-x86_64"
          chmod +x "$t/bin/qemu-system-x86_64"
          PATH="$t/bin:$PATH" ./ob bench --runs 1 --linux-kernel "$RUNNER_TEMP/vmlinuz" > "$t/bench.log" 2>&1 || true
          grep -E '^\| (Disk|Operation)' out/bench/report.md || tail -30 "$t/bench.log"
          ls -la "$t"
          python3 - "$t" <<'PYEOF'
          import glob, re, statistics, sys
          from collections import defaultdict

          LINE = re.compile(r'^(\d+)@(\d+)\.(\d+):(\S+) ?(.*)$')


          def load(path):
              events = []
              with open(path, errors='replace') as f:
                  for line in f:
                      m = LINE.match(line)
                      if m:
                          tid, sec, usec, name, args = m.groups()
                          events.append((int(sec) * 1e6 + int(usec), int(tid), name, args))
              return events


          def field(args, key):
              m = re.search(r'\b' + key + r' (\S+)', args)
              return m.group(1).strip("',") if m else None


          def mean(xs):
              return f'{statistics.mean(xs):7.1f}' if xs else '      -'


          def nvme(events, nlb, kind):
              """Ops of NVMe commands of `nlb` blocks each, grouped by the transfer
              they belong to (1 MiB transfers are two 512 KiB commands)."""
              span = 0x800 if nlb == 1024 else nlb
              ops = []
              last_db = None
              last_key = None
              paio_pending = []
              pool_req = {}
              cmd_of_cid = {}
              for t, tid, name, args in events:
                  if name == 'pci_nvme_mmio_doorbell_sq' and field(args, 'sqid') != '0':
                      last_db = t
                      if ops:
                          ops[-1]['db_after'].append(t)
                  elif name == f'pci_nvme_{kind}' and field(args, 'nlb') == str(nlb):
                      lba = int(field(args, 'lba'), 16)
                      key = lba // span
                      if key != last_key or len(ops[-1]['cmd']) * nlb >= span:
                          ops.append(defaultdict(list))
                          ops[-1]['db'].append(last_db)
                      last_key = key
                      ops[-1]['cmd'].append(t)
                      cmd_of_cid[field(args, 'cid')] = ops[-1]
                      paio_pending.append(ops[-1])
                  elif name in ('pci_nvme_read', 'pci_nvme_write'):
                      paio_pending.append(None)
                  elif name == 'thread_pool_submit':
                      if paio_pending:
                          pool_req[field(args, 'req')] = (paio_pending.pop(0), t)
                  elif name == 'thread_pool_complete':
                      got = pool_req.pop(field(args, 'req'), None)
                      if got and got[0] is not None:
                          op, submitted = got
                          op['work'].append(t - submitted)
                          op['done'].append(t)
                  elif name == 'pci_nvme_rw_cb':
                      op = cmd_of_cid.pop(field(args, 'cid'), None)
                      if op is not None:
                          op['cb'].append(t)
                  elif name == 'pci_nvme_irq_msix' and ops:
                      ops[-1]['irq'].append(t)
                  elif name == 'pci_nvme_mmio_doorbell_cq' and field(args, 'cqid') != '0' and ops:
                      ops[-1]['cqdb'].append(t)
              return ops


          def virtio(events, sectors, kind):
              """Ops of virtio-blk transfers of `sectors` sectors in all."""
              ops = []
              pool_req = {}
              last_key = None
              for t, tid, name, args in events:
                  if name == f'virtio_blk_handle_{kind}':
                      sector = int(field(args, 'sector'))
                      key = sector // sectors
                      if key != last_key or sum(ops[-1]['nsectors']) >= sectors:
                          ops.append(defaultdict(list))
                      last_key = key
                      ops[-1]['handle'].append(t)
                      ops[-1]['nsectors'].append(int(field(args, 'nsectors')))
                  elif name.startswith('virtio_blk_handle'):
                      last_key = None
                  elif not ops:
                      continue
                  elif name == 'virtio_blk_submit_multireq':
                      ops[-1]['multireq'].append(int(field(args, 'num_reqs')))
                  elif name == 'thread_pool_submit':
                      ops[-1]['paio'].append(t)
                      pool_req[field(args, 'req')] = (ops[-1], t)
                  elif name == 'thread_pool_complete':
                      got = pool_req.pop(field(args, 'req'), None)
                      if got:
                          op, submitted = got
                          op['work'].append(t - submitted)
                          op['done'].append(t)
                  elif name == 'virtio_blk_rw_complete':
                      ops[-1]['complete'].append(t)
                  elif name in ('virtio_notify_irqfd', 'virtio_notify'):
                      ops[-1]['irq'].append(t)
              return ops


          def nvme_report(label, ops):
              ops = [o for o in ops if o['db'] and o['db'][0] and o['cb'] and o['done']]
              ops = ops[len(ops) // 10:]
              if len(ops) < 3:
                  print(f'  {label}: {len(ops)} ops')
                  return
              period, sqbh, cmdgap, work, last_done, cbirq, irqcq, guest, irqs, dbs, cqdbs = ([] for _ in range(11))
              for a, b in zip(ops, ops[1:]):
                  d0 = a['db'][0]
                  period.append(b['db'][0] - d0)
                  sqbh.append(a['cmd'][0] - d0)
                  if len(a['cmd']) > 1:
                      cmdgap.append(a['cmd'][-1] - a['cmd'][0])
                  work.extend(a['work'])
                  last_done.append(max(a['done']) - d0)
                  if a['irq']:
                      cbirq.append(a['irq'][-1] - max(a['cb']))
                      if a['cqdb']:
                          irqcq.append(a['cqdb'][-1] - a['irq'][-1])
                          guest.append(b['db'][0] - a['cqdb'][-1])
                  irqs.append(len(a['irq']))
                  cqdbs.append(len(a['cqdb']))
                  dbs.append(1 + len([t for t in a['db_after'] if t < b['db'][0]]))
              print(f'  {label}: {len(ops)} ops, period {mean(period)} us; doorbell->1st cmd {mean(sqbh)}; '
                    f'1st->last cmd {mean(cmdgap)}; worker (submit->complete) {mean(work)}; '
                    f'doorbell->last complete {mean(last_done)}; last cb->last irq {mean(cbirq)}; '
                    f'last irq->cq doorbell {mean(irqcq)}; cq doorbell->next sq doorbell {mean(guest)}; '
                    f'irqs/op {mean(irqs)}; sq doorbells/op {mean(dbs)}; cq doorbells/op {mean(cqdbs)}')


          def virtio_report(label, ops):
              ops = [o for o in ops if o['handle'] and o['done']]
              ops = ops[len(ops) // 10:]
              if len(ops) < 3:
                  print(f'  {label}: {len(ops)} ops')
                  return
              period, hgap, work, last_done, irqlat, guest, nreq, npaio, irqs = ([] for _ in range(9))
              for a, b in zip(ops, ops[1:]):
                  h0 = a['handle'][0]
                  period.append(b['handle'][0] - h0)
                  hgap.append(a['handle'][-1] - h0)
                  work.extend(a['work'])
                  last_done.append(max(a['done']) - h0)
                  if a['irq']:
                      irqlat.append(a['irq'][-1] - max(a['done']))
                      guest.append(b['handle'][0] - a['irq'][-1])
                  nreq.append(len(a['handle']))
                  npaio.append(len(a['paio']))
                  irqs.append(len(a['irq']))
              print(f'  {label}: {len(ops)} ops, period {mean(period)} us; requests/op {mean(nreq)}; '
                    f'host I/Os/op {mean(npaio)}; 1st->last request {mean(hgap)}; worker {mean(work)}; '
                    f'1st request->last complete {mean(last_done)}; last complete->last irq {mean(irqlat)}; '
                    f'last irq->next request {mean(guest)}; irqs/op {mean(irqs)}')


          def excerpt(events, start_name, match, count=2):
              """Prints `count` ops' raw events from the 200th op matching."""
              seen = 0
              start = None
              for i, (t, tid, name, args) in enumerate(events):
                  if name == start_name and match(args):
                      seen += 1
                      if seen == 50:
                          start = i
                          break
              if start is None:
                  return
              t0 = events[start][0]
              n = 0
              for t, tid, name, args in events[max(0, start - 3):]:
                  if t - t0 > 400:
                      break
                  print(f'    {t - t0:8.1f} {tid:>7} {name} {args[:90]}')
                  n += 1
                  if n > 60:
                      break


          def main(directory):
              files = []
              for path in glob.glob(f'{directory}/trace-*.log'):
                  events = load(path)
                  if any(e[2].startswith(('pci_nvme_write', 'virtio_blk_handle')) for e in events):
                      files.append((events[0][0], path, events))
              files.sort()
              for n, (_, path, events) in enumerate(files):
                  print(f'== boot {n + 1} ({path}), {len(events)} events')
                  for size, nlb in (('64 KiB', 128), ('1 MiB', 1024)):
                      for kind in ('read', 'write'):
                          nvme_report(f'NVMe {size} {kind}', nvme(events, nlb, kind))
                  for size, sectors in (('64 KiB', 128), ('1 MiB', 2048)):
                      for kind in ('read', 'write'):
                          ops = virtio(events, sectors, kind)
                          ops = [o for o in ops if sum(o['nsectors']) == sectors]
                          virtio_report(f'virtio {size} {kind}', ops)
                  print('  -- NVMe 1 MiB write, raw:')
                  excerpt(events, 'pci_nvme_write', lambda a: 'nlb 1024' in a and int(field(a, 'lba'), 16) % 0x800 == 0)
                  print('  -- NVMe 1 MiB read, raw:')
                  excerpt(events, 'pci_nvme_read', lambda a: 'nlb 1024' in a and int(field(a, 'lba'), 16) % 0x800 == 0)
                  print('  -- virtio 1 MiB write, raw:')
                  excerpt(events, 'virtio_blk_handle_write', lambda a: int(field(a, 'sector')) % 2048 == 0 and int(field(a, 'nsectors')) > 128)


          main(sys.argv[1])
          PYEOF

      - name: ./ob bench
        run: |
          ./ob bench --gate --linux-kernel "$RUNNER_TEMP/vmlinuz" \
            --summary "$GITHUB_STEP_SUMMARY"

      # TEMPORARY (PR #49): each system's CPU time per disk transfer, from
      # the last run.
      - name: CPU time per disk transfer
        if: always()
        run: |
          for log in out/bench/boot-posix-bench.log out/bench/boot-linux.log; do
            echo "== $log"; grep -a -o 'BENCHCPU .*' "$log" || true
          done

      - name: Upload the benchmark numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            out/bench/report.md
            out/bench/results.json
            out/bench/boot-bench.log
            out/bench/boot-posix-bench.log
            out/bench/boot-linux.log
          if-no-files-found: ignore
          retention-days: 90

  # Instructions per operation, counted by QEMU (`ob bench --instructions`,
  # ADR 0045): the same on every runner, so a hot path that grows fails
  # here even when the timings above are within their noise.
  instructions:
    name: Instruction budgets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf grub-common grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools dosfstools scdoc mandoc \
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob bench --instructions
        run: ./ob bench --instructions --gate --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the instruction counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instructions
          path: |
            out/bench/instructions.md
            out/bench/boot-bench.log
          if-no-files-found: ignore
          retention-days: 90

  # Only the commits a pull request adds: history already on main is left
  # as it is (ADR 0025).
  signoff:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob signoff
        run: ./ob signoff "${{ github.event.pull_request.base.sha }}"

  kani:
    name: Kani proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Kani's binaries go outside ~/.cargo/bin, which rust-cache prunes of
      # anything it did not restore before the Kani cache is saved.
      - name: Cache Kani
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.kani-bin
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}-v2

      - name: Install Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo +stable install --locked --root ~/.kani-bin kani-verifier --version "$KANI_VERSION"
          PATH="$HOME/.kani-bin/bin:$PATH" cargo kani setup

      - name: Put Kani on the PATH
        run: echo "$HOME/.kani-bin/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test kani
        run: ./ob test kani

  tla:
    name: TLA+ models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the TLA+ tools
        uses: actions/cache@v4
        with:
          path: .cache/tla
          key: tla-${{ env.TLA_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test tla
        run: ./ob test tla

  corpus:
    name: Shell corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The corpus's sandbox is a user namespace, which Ubuntu's AppArmor
      # otherwise refuses to unprivileged users (ADR 0103).
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash bash util-linux

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test corpus
        run: ./ob test corpus

  container:
    name: Build container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: ./ob --container doctor
        run: ./ob --container doctor

      - name: ./ob --container test
        run: ./ob --container test

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny (build tool)
        run: cargo deny --manifest-path Cargo.toml check
      # cargo-deny reads ./deny.toml unless told otherwise; the kernel has
      # its own, permissive-only policy.
      - name: cargo deny (kernel)
        run: cargo deny --manifest-path kernel/Cargo.toml --config kernel/deny.toml check
      # The user programs go into /system, so they get the kernel's policy.
      - name: cargo deny (user programs)
        run: cargo deny --manifest-path userspace/Cargo.toml --config kernel/deny.toml check

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Every file needs copyright and license information (ADR 0026). The
      # REUSE tool is GPL-3.0-or-later and only checks the repository.
      - name: reuse lint
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet reuse==6.2.0
          "$RUNNER_TEMP/reuse/bin/reuse" lint
