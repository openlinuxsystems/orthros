# file (ADR 0086): tells what kind of data a file holds, from the magic
# database of the patterns that mark each kind, and looks inside files
# compressed with gzip, bzip2, xz and zstd.
name = "file"
version = "5.47"
summary = "file and libmagic, which tell what kind of data a file holds"
license = "BSD-2-Clause"
homepage = "https://www.darwinsys.com/file/"
depends = ["mlibc", "zlib", "bzip2", "xz", "zstd"]

