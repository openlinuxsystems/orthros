# tmux (ADR 0091): the terminal multiplexer, whose sessions outlast the
# terminal or SSH connection they were started from. Nicholas Marriott's
# and its other authors' code is under the ISC license; what it carries
# from OpenBSD for what the C library lacks is under BSD licenses, its
# allocation wrappers under Tatu Ylonen's short SSH notice, and its
# base64 code also under IBM's notice (LicenseRef-IBM-base64).
name = "tmux"
version = "3.7c"
summary = "the terminal multiplexer"
license = "ISC AND BSD-2-Clause AND BSD-3-Clause AND SSH-short AND LicenseRef-IBM-base64"
homepage = "https://github.com/tmux/tmux"
depends = ["mlibc", "ncurses", "libevent"]

