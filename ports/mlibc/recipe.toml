# The C library (ADR 0068): mlibc, with its Radix system layer in
# sysdeps/radix, and the two libraries its Meson build takes as
# subprojects, at the commits mlibc 7.0.0's wrap files pin.
name = "mlibc"
version = "7.0.0"
summary = "the C library"
license = "MIT"
homepage = "https://github.com/managarm/mlibc"
depends = ["freestnd-cxx-hdrs"]
# The dynamic linker and the shared C library, for bundles (ADR 0071);
# system programs are static.
image = ["system/libraries/ld.so", "system/libraries/libc.so"]

[source]
git = "https://github.com/managarm/mlibc.git"
commit = "7c2a178142625cc9852e59a1a090468c61a62d3b"
tag = "v7.0.0"

# Header-only C++ containers and utilities, compiled into the C library.
[[extra]]
path = "subprojects/frigg"
git = "https://github.com/managarm/frigg.git"
commit = "b0dbea66bc19f7c5546f0039a3be842feb02678c"
license = "MIT"

# Header-only smart pointers, compiled into the C library.
[[extra]]
path = "subprojects/libsmarter"
git = "https://github.com/managarm/libsmarter.git"
commit = "f7d061bc37d485418344452c7ceb28d5df3ba85d"
license = "MIT"

# musl 1.2.5's floating-point conversions, strftime, calendar and time
# zone code, which ports/mlibc/musl keeps and build.sh copies in (ADRs
# 0072 and 0194). Its COPYRIGHT file is musl's, verbatim.
[[bundled]]
name = "musl"
version = "1.2.5"
license = "MIT"
homepage = "https://musl.libc.org"
notices = ["musl/COPYRIGHT"]
