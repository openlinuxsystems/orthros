# nvi2 (ADR 0090): the vi and ex of POSIX, as FreeBSD, NetBSD and macOS
# have them, Zhihao Yuan's continuation of Keith Bostic's nvi of 4.4BSD,
# with wide characters. It keeps the lines it edits in the 4.4BSD
# database library (ports/db1).
name = "nvi"
version = "2.2.2"
summary = "the vi and ex editors"
license = "BSD-3-Clause"
homepage = "https://github.com/lichray/nvi2"
depends = ["mlibc", "ncurses", "db1"]

