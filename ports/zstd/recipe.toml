# Zstandard (ADR 0086): the zstd compressor and libzstd, for .zst files.
# Meta offers it under BSD-3-Clause or GPL-2.0-only; Dukovo takes it
# under BSD-3-Clause. zstd reads and writes .gz, .xz and .lz4 files too,
# with zlib, liblzma and liblz4.
name = "zstd"
version = "1.5.7"
summary = "Zstandard, the zstd compressor, and libzstd"
license = "BSD-3-Clause OR GPL-2.0-only"
homepage = "https://facebook.github.io/zstd/"
depends = ["mlibc", "zlib", "xz", "lz4"]

