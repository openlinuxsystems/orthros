# Info-ZIP's Zip (ADR 0086): makes and changes .zip archives; libarchive's
# unzip reads them. Zip 3.0 is Info-ZIP's last release. The patches are
# the fixes Debian carries, among them three for buffer overflows and
# one for a command injection, each with its author's header.
name = "zip"
version = "3.0"
summary = "Info-ZIP's Zip, which makes .zip archives"
license = "Info-ZIP"
homepage = "https://infozip.sourceforge.net/Zip.html"
depends = ["mlibc", "bzip2"]

[source]
url = "https://downloads.sourceforge.net/infozip/zip30.tar.gz"
sha256 = "f0e8bb1f9b7eb0b01285495a2699df3a4b766784c1765a8f1aeedf63c0806369"
mirrors = ["https://archive.ubuntu.com/ubuntu/pool/main/z/zip/zip_3.0.orig.tar.gz"]
