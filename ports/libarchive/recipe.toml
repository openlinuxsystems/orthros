# libarchive (ADR 0086): reads and writes tar, cpio, pax, zip, 7z, ISO 9660
# and many other archive formats, compressed with any of the ports'
# compressors, and reads RAR. Its bsdtar, bsdcpio and bsdunzip are tar,
# cpio and unzip. libarchive is BSD-2-Clause, with BSD-3-Clause files;
# its BLAKE2 code may be taken under CC0-1.0 or Apache-2.0, and its date
# parser is in the public domain.
name = "libarchive"
version = "3.8.10"
summary = "libarchive, with tar, cpio, unzip and bsdcat"
license = "BSD-2-Clause AND BSD-3-Clause AND (CC0-1.0 OR Apache-2.0)"
homepage = "https://www.libarchive.org"
depends = ["mlibc", "zlib", "bzip2", "xz", "lz4", "zstd"]

