# jq (ADR 0086): the JSON processor scripts filter and build JSON with.
# jq is MIT; it keeps David M. Gay's dtoa.c and g_fmt.c (dtoa), IBM's
# decNumber (ICU), for exact large numbers, NetBSD's strptime and, in
# vendor/oniguruma, K. Kosako's Oniguruma for its regular expressions
# (BSD-2-Clause). Its manual page is made from its documentation, which
# is CC-BY-3.0.
name = "jq"
version = "1.8.2"
summary = "jq, the command-line JSON processor"
license = "MIT AND BSD-2-Clause AND ICU AND dtoa AND CC-BY-3.0"
homepage = "https://jqlang.org"
depends = ["mlibc"]
notices = ["COPYING", "vendor/oniguruma/COPYING"]

