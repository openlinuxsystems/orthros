# zlib (ADR 0086): deflate compression, for the ports that read and
# write gzip and zip files, such as mandoc, which reads compressed
# manual pages. Only the static library and its headers, in the sysroot.
name = "zlib"
version = "1.3.2"
summary = "the deflate compression library"
license = "Zlib"
homepage = "https://zlib.net"
depends = ["mlibc"]

