# git (ADRs 0287 and 0292): the version control system, for repositories
# on this computer and on others it reaches by a path, ssh or https://,
# the last with libcurl. It is under version 2 of
# the GPL only; its diff engine (xdiff), the regular expressions it brings
# and its obstack are under the LGPL 2.1 or later, its bitmaps (ewah)
# under the GPL 2 or later, the SHA-1 that detects collisions (sha1dc) is
# MIT, and the reftable code is Google's BSD-3-Clause. Its manual pages
# come made already from its documentation, from git's own repository of
# them, as making them needs Asciidoctor; they are under git's license.
# The release archive is the one kernel.org serves, and Ubuntu's source
# pool keeps the same file.
name = "git"
version = "2.55.0"
summary = "git, the version control system"
license = "GPL-2.0-only AND LGPL-2.1-or-later AND GPL-2.0-or-later AND MIT AND BSD-3-Clause"
homepage = "https://git-scm.com"
depends = ["mlibc", "zlib", "curl"]
notices = ["COPYING", "LGPL-2.1", "sha1dc/LICENSE.txt", "reftable/LICENSE"]

[source]
url = "https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz"
sha256 = "457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357"
mirrors = ["https://archive.ubuntu.com/ubuntu/pool/main/g/git/git_2.55.0.orig.tar.xz"]

# "Autogenerated manpages for v2.55.0".
[[extra]]
path = "manpages"
git = "https://github.com/gitster/git-manpages.git"
commit = "29c9faa24714fc374490d4f8aa4589e509dc59e4"
license = "GPL-2.0-only"
