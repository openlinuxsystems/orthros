# XZ Utils (ADR 0086): xz and liblzma, for .xz and .lzma files. Its
# library and xz are 0BSD; xzgrep, xzdiff, xzless and xzmore, scripts of
# their own, are GPL-2.0-or-later (ADR 0087). The getopt_long it keeps
# under the LGPL is not built, as mlibc has one.
name = "xz"
version = "5.8.4"
summary = "XZ Utils, the LZMA2 compressor, and liblzma"
license = "0BSD AND GPL-2.0-or-later"
homepage = "https://tukaani.org/xz/"
depends = ["mlibc"]

