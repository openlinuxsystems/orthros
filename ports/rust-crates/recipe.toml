# Crates from crates.io that programs in Rust need and that do not build
# for Radix as they are (ADR 0080): each patched in patches/<crate>.patch
# and installed into the toolchain, where Cargo for Radix gives programs
# the patched crate in place of crates.io's. One version of each semver
# line: a program's Cargo.lock names that version. The libc crate is the
# rust-std port's.
name = "rust-crates"
version = "1"
summary = "crates.io crates patched for Radix, for programs in Rust"
license = "(MIT OR Apache-2.0) AND MIT AND (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT) AND Apache-2.0 AND ISC"
homepage = "https://crates.io"
depends = ["rust-std"]
toolchain = true

