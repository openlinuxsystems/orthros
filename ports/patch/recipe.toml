# GNU patch (ADR 0086): applies diffs, including git's, with their
# renames, copies and mode changes. It is a separate program under the
# GPL, which is allowed in the ports (ADR 0087).
name = "patch"
version = "2.8"
summary = "GNU patch, which applies diffs to files"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/patch/"
depends = ["mlibc"]

