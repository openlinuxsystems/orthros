[package]
name = "xtask"
description = "ob, the OrthrOS build tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Kernel libraries shared with the build tool: the symbol table format, the
# console fonts (to read the screen in boot tests), the microcode format (to
# build test updates), and the lists of kernel flags and kdb commands that
# `ob docs --check` compares with the manual pages.
radix-fbcon = { path = "../../kernel/lib/fbcon" }
radix-hal = { path = "../../kernel/hal" }
radix-kdb = { path = "../../kernel/lib/kdb" }
radix-ksyms = { path = "../../kernel/lib/ksyms" }
radix-microcode = { path = "../../kernel/lib/microcode" }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[lints]
workspace = true
